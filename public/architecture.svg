<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="100%" height="100%" style="background:#0a0e17; font-family:'JetBrains Mono', monospace; font-size:12px;">
  <!-- Grid Background -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb" />
      <stop offset="100%" stop-color="#f5576c" />
    </linearGradient>
    <linearGradient id="hardwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0a16" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f093fb"/>
    </marker>
  </defs>

  <rect width="880" height="580" fill="url(#bgGrad)" />
  <rect width="880" height="580" fill="url(#grid)" opacity="0.6"/>

  <!-- OUTER BOUNDARY: Browser Environment -->
  <rect x="20" y="20" width="840" height="540" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="35" y="45" fill="#9ca3af" font-size="14" font-weight="bold" letter-spacing="1">USER BROWSER ENVIRONMENT</text>

  <!-- SUBGRAPH 1: Main UI Thread -->
  <rect x="40" y="70" width="400" height="340" rx="8" fill="#11131e" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="55" y="92" fill="#3b82f6" font-size="12" font-weight="bold">Main UI Thread (60 FPS Focus)</text>

  <!-- Node: React UI -->
  <rect x="120" y="120" width="240" height="50" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="240" y="142" text-anchor="middle" fill="#ffffff" font-weight="bold">React 19 / Next.js 16 UI</text>
  <text x="240" y="157" text-anchor="middle" fill="#9ca3af" font-size="10">Chat Drawer &amp; Page Router</text>

  <!-- Node: Router -->
  <rect x="120" y="220" width="240" height="50" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="240" y="242" text-anchor="middle" fill="#ffffff" font-weight="bold">Tier 1: Command Router</text>
  <text x="240" y="257" text-anchor="middle" fill="#9ca3af" font-size="10">Regex Navigation Interceptor</text>

  <!-- Node: Fallback -->
  <rect x="120" y="320" width="240" height="50" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="240" y="342" text-anchor="middle" fill="#ffffff" font-weight="bold">Tier 2: Fallback Intent Engine</text>
  <text x="240" y="357" text-anchor="middle" fill="#9ca3af" font-size="10">Regex Factual Engine (&lt;5ms)</text>

  <!-- SUBGRAPH 2: Dedicated Web Worker Thread -->
  <rect x="470" y="70" width="370" height="150" rx="8" fill="#11131e" fill-opacity="0.9" stroke="#f093fb" stroke-width="1.5"/>
  <text x="485" y="92" fill="#f093fb" font-size="12" font-weight="bold">Dedicated Web Worker Thread</text>

  <!-- Node: WebLLM -->
  <rect x="535" y="120" width="240" height="60" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="655" y="145" text-anchor="middle" fill="#ffffff" font-weight="bold">WebLLM Worker Singleton</text>
  <text x="655" y="160" text-anchor="middle" fill="#fbcfe8" font-size="10">Qwen2.5-Instruct-1.5B (GPGPU Engine)</text>

  <!-- SUBGRAPH 3: Device Hardware -->
  <rect x="470" y="250" width="370" height="290" rx="8" fill="#11131e" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <text x="485" y="272" fill="#10b981" font-size="12" font-weight="bold">Device Hardware</text>

  <!-- Node: VRAM -->
  <rect x="520" y="310" width="270" height="70" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="655" y="337" text-anchor="middle" fill="#ffffff" font-weight="bold">WebGPU VRAM Footprint</text>
  <text x="655" y="354" text-anchor="middle" fill="#34d399" font-weight="bold">~1.6 GB Allocation</text>
  <text x="655" y="368" text-anchor="middle" fill="#9ca3af" font-size="10">Active Weights + KV Cache Buffers</text>

  <!-- Node: Cache -->
  <rect x="520" y="420" width="270" height="70" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="655" y="447" text-anchor="middle" fill="#ffffff" font-weight="bold">IndexedDB Cache</text>
  <text x="655" y="464" text-anchor="middle" fill="#34d399" font-weight="bold">~950 MB Weight Shards</text>
  <text x="655" y="478" text-anchor="middle" fill="#9ca3af" font-size="10">Local Weight Shards Storage</text>

  <!-- RELATIONSHIP ARROWS -->
  <!-- 1. User Prompt (ReactUI -> Router) -->
  <path d="M 220 170 L 220 220" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="200" fill="#9ca3af" font-size="10" font-weight="bold">1. User Prompt</text>

  <!-- 2. Router -> ReactUI (Matched Navigation) -->
  <path d="M 260 220 L 260 170" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="200" fill="#3b82f6" font-size="10" font-weight="bold">Matched Nav</text>

  <!-- 3. Router -> Fallback (No Match) -->
  <path d="M 240 270 L 240 320" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="300" fill="#9ca3af" font-size="10">No Command Match</text>

  <!-- 4. Fallback -> ReactUI (Instant Answer) -->
  <path d="M 170 320 L 170 170" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="80" y="240" fill="#10b981" font-size="10" font-weight="bold">Instant Answer (&lt;5ms)</text>

  <!-- 5. ReactUI -> WebLLM (Dispatch Request) -->
  <path d="M 360 135 L 535 135" fill="none" stroke="#f093fb" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-pink)"/>
  <text x="400" y="125" fill="#f093fb" font-size="10" font-weight="bold">Dispatch Query</text>

  <!-- 6. WebLLM -> ReactUI (Stream Tokens) -->
  <path d="M 535 160 L 360 160" fill="none" stroke="#f093fb" stroke-width="2" marker-end="url(#arrow-pink)"/>
  <text x="400" y="175" fill="#f093fb" font-size="10" font-weight="bold">2. Stream Tokens</text>

  <!-- 7. WebLLM <-> VRAM (Execute GPGPU Tasks) -->
  <path d="M 640 180 L 640 310" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 640 310 L 640 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="645" y="235" fill="#10b981" font-size="9">GPGPU Exec &amp; KV Cache</text>

  <!-- 8. WebLLM <-> Cache (Read Weights) -->
  <path d="M 720 180 C 780 230, 780 370, 720 420" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="765" y="300" fill="#10b981" font-size="9">Fetch Weights</text>
</svg>
